name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  code-quality:
    name: "Code quality"
    runs-on: ubuntu-22.04
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Install dependencies"
        run: Build/Scripts/runTests.sh -p 8.2 -U 11 -s composerUpdate

      - name: "Validate composer.json"
        run: Build/Scripts/runTests.sh -p 8.2 -s composerValidate

      - name: "Check UTF-8 BOM"
        run: Build/Scripts/runTests.sh -p 8.2 -s checkBom

      - name: "Code style"
        run: Build/Scripts/runTests.sh -p 8.2 -s cgl -n

      - name: "Lint PHP 8.2"
        run: Build/Scripts/runTests.sh -p 8.2 -s lintPhp

      - name: "Lint PHP 8.5"
        run: Build/Scripts/runTests.sh -p 8.5 -s lintPhp

  tests:
    name: "PHP ${{ matrix.php }}, PHPUnit ${{ matrix.phpunit }} (${{ matrix.dependencies }})"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', phpunit: '11', dependencies: 'lowest' }
          - { php: '8.2', phpunit: '11', dependencies: 'highest' }
          - { php: '8.5', phpunit: '11', dependencies: 'highest' }
          - { php: '8.3', phpunit: '12', dependencies: 'lowest' }
          - { php: '8.3', phpunit: '12', dependencies: 'highest' }
          - { php: '8.5', phpunit: '12', dependencies: 'highest' }
          - { php: '8.4', phpunit: '13', dependencies: 'lowest' }
          - { php: '8.4', phpunit: '13', dependencies: 'highest' }
          - { php: '8.5', phpunit: '13', dependencies: 'highest' }
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Install highest dependencies"
        if: matrix.dependencies == 'highest'
        run: Build/Scripts/runTests.sh -p ${{ matrix.php }} -U ${{ matrix.phpunit }} -s composerUpdate

      - name: "Install lowest dependencies"
        if: matrix.dependencies == 'lowest'
        run: Build/Scripts/runTests.sh -p ${{ matrix.php }} -U ${{ matrix.phpunit }} -s composerUpdateMin

      # PHPStan analyses against the newest release of a major only: the lowest ones predate APIs the
      # per-major configuration expects, such as the issue trigger resolvers of PHPUnit 13.1.
      - name: "PHPStan"
        if: matrix.dependencies == 'highest'
        run: Build/Scripts/runTests.sh -p ${{ matrix.php }} -s phpstan

      - name: "Unit and end-to-end tests"
        run: Build/Scripts/runTests.sh -p ${{ matrix.php }} -s unit
